<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>F1 Challenge CMT 2025 — Web</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #ddd; font: 13px system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  #wrap { position: relative; width: min(96vw, calc((100vh - 120px) * 4 / 3)); aspect-ratio: 4 / 3; background: #000; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: auto; outline: none; cursor: default; }
  #status { position: absolute; inset: auto 0 45% 0; text-align: center; font-size: 15px; color: #fff; text-shadow: 0 1px 3px #000; }
  header { display: flex; gap: 12px; align-items: center; width: min(96vw, calc((100vh - 120px) * 4 / 3)); }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; } #stats { margin-left: auto; color: #8a8; font-variant-numeric: tabular-nums; }
  button { background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  #log { width: min(96vw, calc((100vh - 120px) * 4 / 3)); height: 70px; overflow: auto; font: 11px ui-monospace, monospace; color: #888; }
</style>
</head>
<body>
<main>
  <header><h1>F1 Challenge CMT 2025 · motor original emulado</h1><span id="stats"></span><button id="full">Pantalla completa</button></header>
  <div id="wrap"><canvas id="screen" width="800" height="600" tabindex="0"></canvas><div id="status">Cargando…</div></div>
  <div id="log"></div>
</main>
<script type="module" src="/web/main.js"></script>
</body>
</html>
