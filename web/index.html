<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Challenge CMT 2025 — Web</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #ddd; font: 14px system-ui, sans-serif; }
  main { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(96vw, calc((100vh - 110px) * 4 / 3)); }
  .bar h1 { font-size: 14px; margin: 0; font-weight: 600; } #stats { margin-left: auto; color: #8a8; font-variant-numeric: tabular-nums; font-size: 12px; }
  #wrap { position: relative; width: min(96vw, calc((100vh - 110px) * 4 / 3)); aspect-ratio: 4 / 3; background: #000; }
  canvas { width: 100%; height: 100%; display: block; outline: none; }
  #panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b0b0dee; text-align: center; padding: 24px; }
  #panel[hidden] { display: none; } #panel p { max-width: 640px; line-height: 1.45; margin: 0; color: #bbb; }
  #panel h2 { margin: 0; font-size: 20px; color: #fff; }
  button { background: #c4161c; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  button.sec { background: #2a2a2e; font-size: 13px; padding: 6px 12px; }
  progress { width: 420px; height: 10px; } #ptext { font-size: 12px; color: #999; font-variant-numeric: tabular-nums; min-height: 1.2em; }
  #net { position: absolute; left: 8px; bottom: 8px; background: #000c; color: #fd6; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  #log { width: min(96vw, calc((100vh - 110px) * 4 / 3)); height: 60px; overflow: auto; font: 11px ui-monospace, monospace; color: #777; }
</style>
</head>
<body>
<main>
  <div class="bar"><h1>F1 Challenge CMT 2025 · motor original emulado en el navegador</h1><span id="stats"></span><button class="sec" id="full">Pantalla completa</button></div>
  <div id="wrap">
    <canvas id="screen" width="1024" height="768" tabindex="0"></canvas>
    <div id="net" hidden></div>
    <div id="panel">
      <h2 id="ptitle">Cargando…</h2>
      <p id="pmsg"></p>
      <progress id="pbar" max="1" value="0" hidden></progress>
      <div id="ptext"></div>
      <div id="pbtns"></div>
    </div>
  </div>
  <div id="log"></div>
</main>
<script type="module" src="/web/main.js"></script>
</body>
</html>
